<!doctype html>
<html lang="zh-cn">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">
    <meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1'>
    <title>基于 tracking.js 的前端纯浏览器人脸特征识别、精确定位提取与图片特效合成演示工具</title>
    <meta content="tracking.js,前端人脸识别,人脸识别提取,图片合成" name="Keywords">
    <meta content="本示例深入演示了如何纯粹依托前端技术结合 tracking.js 库，在浏览器环境中高效实现人脸特征识别、精确定位提取，并无缝完成图片特效处理与最终合成的完整工作流程。通过上传本地照片或输入远程图片链接即可快速体验。本项目完整展示了前端纯图像处理能力，为您提供开箱即用、无需后端依赖的前端人脸处理体验与参考。" name="Description">
    <meta name="format-detection" content="telephone=no">
    <link rel="stylesheet" href="./assets/ui.css">
    <style>
    .demo-container {
        position: relative;
        overflow: hidden;
    }

    .rect {
        border: 2px solid #a64ceb;
        left: -1000px;
        position: absolute;
        top: -1000px;
    }

    .demo {
        box-sizing: border-box;
        width: 100%;
        max-width: 640px;
        max-height: 70vh;
        overflow: auto;
        background: #fff;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    .demo li {
        display: inline-block;
        width: 8em;
        height: 8em;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        cursor: pointer;
    }

    .foot {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background: #333;
        padding: 24px;
        overflow: hidden;
        color: #999;
        font-size: 14px;
        text-align: center;
    }
    body { min-width: 0; padding-bottom: 100px; }
    #img, #myCanvas { max-width: 100%; height: auto; }
    #img:not([src]) { display: none; }
    .compound.hide { display: none; }
    input[type="range"] { width: 100%; }
    #trackingStatus { margin: 12px 0; }
    @media (max-width: 720px) {
        .wrap { width: auto; min-width: 0; }
        .wrap > .row > .span-6, .form-inline > .form-group > .span-6 { width: 100%; }
    }
    </style>
    <script>
    var _hmt = _hmt || [];

        var hm = document.createElement("script");

</head>

<body>
    <h1 class="tc m"><a href="//refined-x.com" title="前端路上">前端人脸识别-提取-合成</a></h1>
    <div class="wrap">
        <div class="form-inline p m-tb" style="background:#fcfcfc">
            <div class="form-group row">
                <div class="span-6">
                    <h2>选择图片</h2>
                    <div class="form-group row">
                        <label class="control-label span-3">上传本地图片:</label>
                        <div class="span-9">
                            <label class="btn btn-primary" style="overflow: hidden;">
                                上传
                                <input id="file" type="file" accept="image/png,image/jpeg" style="position: absolute;top:-100px;">
                            </label>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="control-label span-3">载入远程图片:</label>
                        <div class="span-9">
                            <input type="text" class="form-control" id="remoteImg" placeholder="远程图片URL">
                            <button type="button" class="btn btn-success" id="loadRemote">加载</button>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="control-label span-3">使用示例图片:</label>
                        <div class="span-9">
                            <button type="button" class="btn btn-ghost btn-success" id="toggleDemo">打开/关闭图库</button>
                        </div>
                    </div>
                    <ul class="demo hide">
                        <li data-src="./assets/1.jpg" data-stepsize="1.6" data-trackmode="1.5"></li>
                        <li data-src="./assets/9.jpg" data-stepsize="1.7" data-trackmode="1.6"></li>
                        <li data-src="./assets/4.jpg" data-stepsize="1.6" data-trackmode="1.4"></li>
                        <li data-src="./assets/5.jpg" data-stepsize="1.7" data-trackmode="1.6"></li>
                        <li data-src="./assets/6.jpg" data-stepsize="1.7" data-trackmode="1.6"></li>
                        <li data-src="./assets/7.png" data-stepsize="1.5" data-trackmode="1.5"></li>
                        <li data-src="./assets/8.jpg" data-stepsize="1.3" data-trackmode="1.4"></li>
                    </ul>
                </div>
                <div class="span-6">
                    <h2>参数设置</h2>
                    <div class="form-group row">
                        <label class="span-2" for="myStepSize">识别步长</label>
                        <div class="span-4"><input type="range" id="myStepSize" min="1" max="2" step="0.1" value="1.5"><output id="stepValue" for="myStepSize">1.5</output></div>
                    </div>
                    <div class="form-group row">
                        <label class="span-2" for="myScaleFactor">比例因子</label>
                        <div class="span-4"><input type="range" id="myScaleFactor" min="1.1" max="2" step="0.1" value="1.5"><output id="scaleValue" for="myScaleFactor">1.5</output></div>
                    </div>
                    <div class="form-group text-info">
                        选择合适的参数可以达到最佳识别效果，如果不知从何下手，可以选择<em>使用示例图片</em>。
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <div class="span-6">
                    <button type="button" class="btn btn-danger btn-lg" id="track" disabled>开始识别</button>
                    <button type="button" class="btn btn-danger btn-lg btn-ghost" id="reset">重置</button>
                </div>
                <div class="span-6">
                    <button type="button" class="btn btn-success btn-lg hide compound male">合成男军装照</button>
                    <button type="button" class="btn btn-warning btn-lg hide compound">合成女军装照</button>
                </div>
            </div>
        </div>
        <p id="trackingStatus" role="status" aria-live="polite" data-state="empty">请选择图片。</p>
        <div class="row">
            <div class="span-6">
                <div class="demo-container" id="main">
                    <img id="img" crossOrigin="" alt="待进行人脸识别的图片" />
                </div>
            </div>
            <div class="span-6">
                <canvas id="myCanvas"></canvas>
            </div>
        </div>
    </div>
    <div class="hide">
        <img src="./assets/female.png" id="femaleBg" alt="女军装合成背景模板">
        <img src="./assets/male.png" id="maleBg" alt="男军装合成背景模板">
    </div>
    <footer class="foot">
        <p>© 2017 - 3017  Author

            <a href="https://trackingjs.com/" target="_blank">trackingjs</a> ]
        </p>
    </footer>
    <script src="./assets/tracking-min.js"></script>
    <script src="./assets/face-min.js"></script>
    <script src="./assets/alloyimage-1.1.js"></script>
    <script type="module" src="./assets/tracking-demo.mjs"></script>
</body>

</html>
